<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#075e54">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="manifest.json">
    <title>Miso Reminder</title>
    <style>
        /* --- ESTILOS (CSS) --- */

        @media (min-width: 600px) {
            .phone-container {
                max-width: 400px; /* Limitamos el ancho */
                height: 85vh;     /* Limitamos el alto */
                border-radius: 20px; /* Bordes redondeados */
                box-shadow: 0 0 50px rgba(0,0,0,0.5); /* Sombra elegante */
            }
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #333; /* Fondo oscuro para escritorio */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .phone-container {
            background-color: #fff;
            width: 100%;
            height: 100%; /* Ocupa todo el alto por defecto */
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Cabecera */
        .header {
            background-color: #075e54;
            color: white;
            padding: 15px;
            display: flex;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 1.2rem;
            flex-grow: 1;
        }

        .push-status {
            font-size: 0.72rem;
            padding: 4px 8px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.35);
            background: rgba(255,255,255,0.15);
            white-space: nowrap;
        }

        .push-status.ok {
            background: rgba(37, 211, 102, 0.25);
            border-color: rgba(37, 211, 102, 0.7);
        }

        .push-status.warn {
            background: rgba(255, 193, 7, 0.22);
            border-color: rgba(255, 193, 7, 0.75);
        }

        .push-status.off {
            background: rgba(244, 67, 54, 0.22);
            border-color: rgba(244, 67, 54, 0.75);
        }

        /* Área de Chat (Visualización) */
        .chat-area {
            flex: 1;
            background-color: #efeae2;
            background-image:
                radial-gradient(circle at 1px 1px, rgba(7, 94, 84, 0.06) 1px, transparent 0),
                linear-gradient(180deg, rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0.1));
            background-size: 14px 14px, 100% 100%;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .message-bubble {
            background-color: #dcf8c6;
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            align-self: flex-end; /* Mensajes del usuario a la derecha */
            max-width: 80%;
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
            font-size: 0.95rem;
        }

          .reminder-header {
              display: flex;
              align-items: center;
              justify-content: space-between;
              gap: 8px;
          }

          .reminder-check {
              margin-right: 6px;
          }

          .delete-reminder-btn {
              background: transparent;
              border: none;
              color: #9e2a2a;
              cursor: pointer;
              width: auto;
              height: auto;
              margin: 0;
              padding: 0;
              font-size: 0.8rem;
              text-decoration: underline;
          }

        /* Panel de Configuración y Entrada */
        .input-area {
            background-color: #f0f0f0;
            padding: 15px;
            border-top: 1px solid #ddd;
        }

        .config-panel {
            background-color: #fff;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
            font-size: 0.85rem;
        }

        .form-row {
            margin-bottom: 8px;
            display: flex;
            gap: 10px;
        }
        
        .form-row label {
            font-weight: bold;
            display: block;
            margin-bottom: 3px;
        }

        input, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        textarea {
            width: 100%;
            height: 60px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 20px;
            resize: none;
            font-family: inherit;
        }

        button {
            background-color: #128c7e;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 50%;
            cursor: pointer;
            margin-left: 10px;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
        }

        button:hover {
            background-color: #075e54;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
        }

          .version-footer {
              margin-top: 8px;
              padding-top: 6px;
              border-top: 1px dashed #cfcfcf;
          }

          .version-accordion {
              font-size: 0.68rem;
              color: #5a5a5a;
          }

          .version-accordion summary {
              cursor: pointer;
              user-select: none;
              list-style: none;
              font-size: 0.68rem;
              color: #4a4a4a;
          }

          .version-accordion summary::-webkit-details-marker {
              display: none;
          }

          .version-content {
              margin-top: 4px;
              font-size: 0.65rem;
              color: #666;
          }

        .hidden {
            display: none;
        }
        
        #toggleConfig {
            background: none;
            border: none;
            color: #555;
            font-size: 0.8rem;
            cursor: pointer;
            width: auto;
            height: auto;
            padding: 0;
            margin: 0 0 10px 0;
            text-decoration: underline;
        }

        #quickTestBtn {
            background: none;
            border: none;
            color: #0b6b5f;
            font-size: 0.8rem;
            cursor: pointer;
            width: auto;
            height: auto;
            padding: 0;
            margin: 0 0 10px 0;
            text-decoration: underline;
        }

          #selectModeBtn,
          #deleteSelectedBtn,
          #deleteAllBtn {
              background: none;
              border: none;
              color: #0b6b5f;
              font-size: 0.8rem;
              cursor: pointer;
              width: auto;
              height: auto;
              padding: 0;
              margin: 0 0 10px 0;
              text-decoration: underline;
          }

          #deleteSelectedBtn,
          #deleteAllBtn {
              color: #9e2a2a;
          }
    </style>
</head>
<body>

    <div class="phone-container">
        <div class="header">
            <h1>Miso Reminder</h1>
              <span id="pushStatus" class="push-status warn">Push: Verificando...</span>
        </div>

        <div class="chat-area" id="chatContainer">
            </div>

        <div class="input-area">
            
            <button id="toggleConfig">⚙️ Configurar Recordatorio</button>
            <button id="quickTestBtn">⏱️ Probar en 15 segundos</button>
              <button id="selectModeBtn">☑️ Seleccionar recordatorios</button>
              <button id="deleteSelectedBtn" class="hidden">🗑️ Borrar seleccionados</button>
              <button id="deleteAllBtn">🧹 Borrar todos</button>

            <div class="config-panel hidden" id="configPanel">
                <div class="form-row">
                    <div style="flex:1">
                        <label>Fecha y Hora:</label>
                        <input type="datetime-local" id="reminderDate">
                    </div>
                </div>
                
                <div class="form-row">
                    <div style="flex:1">
                        <label>Periodicidad:</label>
                        <select id="periodicity">
                            <option value="once">Una sola vez</option>
                            <option value="daily">Diario</option>
                            <option value="weekly">Semanal</option>
                            <option value="monthly">Mensual</option>
                        </select>
                    </div>
                    <div style="flex:1">
                        <label>Medio:</label>
                        <select id="method">
                            <option value="self">Auto-recordatorio (Notificación)</option>
                            <option value="whatsapp">WhatsApp Web</option>
                            <option value="email">Correo Electrónico</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div style="flex:1">
                        <label>Texto Previo (Intro):</label>
                        <input type="text" id="prefixText" value="Hola! Te recuerdo que: ">
                    </div>
                </div>
            </div>

            <div class="input-wrapper">
                <textarea id="messageInput" placeholder="Escribe tu mensaje... Ej: Jessica, mañana es el envío..."></textarea>
                <button onclick="crearRecordatorio()">➤</button>
            </div>

              <div class="version-footer">
                  <details class="version-accordion">
                      <summary>Version</summary>
                      <div class="version-content" id="versionText"></div>
                  </details>
              </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'miso-reminders-v2';
        const DEVICE_KEY = 'miso-device-id';
          const APP_VERSION_FALLBACK = '1.1.0';
        const MAX_TIMEOUT = 2147483647;
        const timers = new Map();
        const processingReminderIds = new Set();
          const selectedReminderIds = new Set();
        let backendPublicKey = null;
          let appVersion = APP_VERSION_FALLBACK;
          let selectionModeEnabled = false;

        const configPanel = document.getElementById('configPanel');
        const toggleBtn = document.getElementById('toggleConfig');
        const quickTestBtn = document.getElementById('quickTestBtn');
          const selectModeBtn = document.getElementById('selectModeBtn');
          const deleteSelectedBtn = document.getElementById('deleteSelectedBtn');
          const deleteAllBtn = document.getElementById('deleteAllBtn');
        const pushStatusEl = document.getElementById('pushStatus');
          const versionTextEl = document.getElementById('versionText');

        toggleBtn.addEventListener('click', () => {
            configPanel.classList.toggle('hidden');
        });

        quickTestBtn.addEventListener('click', crearRecordatorioPrueba);
          selectModeBtn.addEventListener('click', toggleModoSeleccion);
          deleteSelectedBtn.addEventListener('click', borrarSeleccionados);
          deleteAllBtn.addEventListener('click', borrarTodos);

        initApp();

        async function initApp() {
              await cargarVersionApp();
                            renderizarVersionApp();
            await actualizarEstadoPushUI();
            await registrarServiceWorker();
            await cargarClavePublicaBackend();
            await asegurarSuscripcionPush();
            await sincronizarRecordatoriosConServidor();
            await actualizarEstadoPushUI();
            restaurarYProgramarRecordatorios();
            iniciarVigilanciaRecordatorios();
        }

        async function crearRecordatorio() {
            const mensaje = document.getElementById('messageInput').value.trim();
            const fecha = document.getElementById('reminderDate').value;
            const periodicidad = document.getElementById('periodicity').value;
            const medio = document.getElementById('method').value;
            const prefijo = document.getElementById('prefixText').value;

            if (!mensaje) {
                alert('Por favor escribe un mensaje para el recordatorio.');
                return;
            }

            if (fecha && Number.isNaN(new Date(fecha).getTime())) {
                alert('La fecha del recordatorio no es válida.');
                return;
            }

            const ahora = new Date();
            const fechaBase = fecha ? new Date(fecha) : ahora;
            const proximaFecha = obtenerProximaFecha(fechaBase, periodicidad, ahora);
            const mensajeCompleto = `${prefijo} "${mensaje}"`;

            const recordatorio = {
                id: generarId(),
                texto: mensaje,
                mensajeCompleto,
                periodicidad,
                medio,
                baseDateISO: fechaBase.toISOString(),
                nextTriggerAt: proximaFecha.getTime(),
                createdAt: Date.now(),
                deliveryMode: 'local'
            };

            const permiso = await solicitarPermisoNotificaciones(true);
            const pushProgramado = await intentarProgramarEnServidor(recordatorio, permiso);

            if (pushProgramado) {
                recordatorio.deliveryMode = 'server';
            }

            const recordatorios = obtenerRecordatorios();
            recordatorios.push(recordatorio);
            guardarRecordatorios(recordatorios);

            if (recordatorio.deliveryMode === 'local') {
                programarRecordatorio(recordatorio);
            }

              renderizarListaRecordatorios();

            document.getElementById('messageInput').value = '';
            alert(`✅ Recordatorio guardado para ${formatearFecha(recordatorio.nextTriggerAt)}.`);
        }

        async function crearRecordatorioPrueba() {
            const mensajeInput = document.getElementById('messageInput').value.trim();
            const medio = document.getElementById('method').value;
            const prefijo = document.getElementById('prefixText').value;

            const mensaje = mensajeInput || 'Prueba rápida de notificación';
            const ahora = Date.now();
            const proximaFecha = ahora + 15000;
            const mensajeCompleto = `${prefijo} "${mensaje}"`;

            const recordatorio = {
                id: generarId(),
                texto: `${mensaje} (test 15s)`,
                mensajeCompleto,
                periodicidad: 'once',
                medio,
                baseDateISO: new Date(proximaFecha).toISOString(),
                nextTriggerAt: proximaFecha,
                createdAt: ahora,
                deliveryMode: 'local'
            };

            const permiso = await solicitarPermisoNotificaciones(true);
            const pushProgramado = await intentarProgramarEnServidor(recordatorio, permiso);

            if (pushProgramado) {
                recordatorio.deliveryMode = 'server';
            }

            const recordatorios = obtenerRecordatorios();
            recordatorios.push(recordatorio);
            guardarRecordatorios(recordatorios);

            if (recordatorio.deliveryMode === 'local') {
                programarRecordatorio(recordatorio);
            }

              renderizarListaRecordatorios();

            alert(`🧪 Prueba programada para ${formatearFecha(recordatorio.nextTriggerAt)}.`);
        }

        function agregarBurbujaChat(recordatorio) {
            const chatContainer = document.getElementById('chatContainer');
            const bubble = document.createElement('div');
            bubble.classList.add('message-bubble');

              const header = document.createElement('div');
              header.className = 'reminder-header';

              const left = document.createElement('div');

              if (selectionModeEnabled) {
                  const checkbox = document.createElement('input');
                  checkbox.type = 'checkbox';
                  checkbox.className = 'reminder-check';
                  checkbox.checked = selectedReminderIds.has(recordatorio.id);
                  checkbox.addEventListener('change', event => {
                      if (event.target.checked) {
                          selectedReminderIds.add(recordatorio.id);
                      } else {
                          selectedReminderIds.delete(recordatorio.id);
                      }
                  });
                  left.appendChild(checkbox);
              }

              const title = document.createElement('strong');
              title.textContent = recordatorio.texto;
              left.appendChild(title);
              header.appendChild(left);

              const deleteBtn = document.createElement('button');
              deleteBtn.type = 'button';
              deleteBtn.className = 'delete-reminder-btn';
              deleteBtn.textContent = 'borrar';
              deleteBtn.addEventListener('click', () => {
                  borrarPorId(recordatorio.id);
              });
              header.appendChild(deleteBtn);

              bubble.appendChild(header);

              const meta = document.createElement('small');
              meta.style.opacity = '0.7';
              meta.style.fontSize = '0.7rem';
              meta.textContent = `📅 ${formatearFecha(recordatorio.nextTriggerAt)} | 🔁 ${traducirPeriodicidad(recordatorio.periodicidad)} | 📡 ${traducirMedio(recordatorio.medio)} ${recordatorio.deliveryMode === 'server' ? '| ☁️ Push' : '| 📱 Local'}`;
              bubble.appendChild(meta);

            chatContainer.appendChild(bubble);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

          function renderizarListaRecordatorios() {
              const chatContainer = document.getElementById('chatContainer');
              chatContainer.innerHTML = '';

              const recordatorios = obtenerRecordatorios();
              recordatorios.forEach(agregarBurbujaChat);

              actualizarControlesSeleccion();
          }

          function actualizarControlesSeleccion() {
              if (!selectModeBtn || !deleteSelectedBtn) {
                  return;
              }

              selectModeBtn.textContent = selectionModeEnabled
                  ? '✅ Seleccionando (tocar para salir)'
                  : '☑️ Seleccionar recordatorios';

              if (selectionModeEnabled) {
                  deleteSelectedBtn.classList.remove('hidden');
              } else {
                  deleteSelectedBtn.classList.add('hidden');
              }
          }

          function toggleModoSeleccion() {
              selectionModeEnabled = !selectionModeEnabled;
              if (!selectionModeEnabled) {
                  selectedReminderIds.clear();
              }
              renderizarListaRecordatorios();
          }

          async function borrarPorId(reminderId) {
              const ok = window.confirm('¿Borrar este recordatorio?');
              if (!ok) {
                  return;
              }

              await borrarRecordatorios([reminderId], false);
          }

          async function borrarSeleccionados() {
              const ids = Array.from(selectedReminderIds);
              if (!ids.length) {
                  alert('No hay recordatorios seleccionados.');
                  return;
              }

              const ok = window.confirm(`¿Borrar ${ids.length} recordatorio(s) seleccionados?`);
              if (!ok) {
                  return;
              }

              await borrarRecordatorios(ids, false);
              selectedReminderIds.clear();
              renderizarListaRecordatorios();
          }

          async function borrarTodos() {
              const recordatorios = obtenerRecordatorios();
              if (!recordatorios.length) {
                  alert('No hay recordatorios para borrar.');
                  return;
              }

              const ok = window.confirm('¿Borrar TODOS los recordatorios?');
              if (!ok) {
                  return;
              }

              const ids = recordatorios.map(item => item.id);
              await borrarRecordatorios(ids, true);
              selectedReminderIds.clear();
              renderizarListaRecordatorios();
          }

          async function borrarRecordatorios(ids, all) {
              const recordatorios = obtenerRecordatorios();
              const idSet = new Set(ids);

              const restantes = all
                  ? []
                  : recordatorios.filter(item => !idSet.has(item.id));

              recordatorios
                  .filter(item => all || idSet.has(item.id))
                  .forEach(item => limpiarTemporizador(item.id));

              guardarRecordatorios(restantes);
              renderizarListaRecordatorios();

              await borrarRecordatoriosEnServidor(ids, all);
          }

          async function borrarRecordatoriosEnServidor(ids, all) {
              try {
                  const deviceId = obtenerDeviceId();
                  await fetch('./api/reminders', {
                      method: 'DELETE',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify({ deviceId, ids, all })
                  });
              } catch {
                  // Si falla, al menos quedan borrados localmente.
              }
          }

        function restaurarYProgramarRecordatorios() {
            const recordatorios = obtenerRecordatorios();

            recordatorios.forEach(recordatorio => {
                if (!recordatorio.nextTriggerAt) {
                    const base = recordatorio.baseDateISO ? new Date(recordatorio.baseDateISO) : new Date();
                    recordatorio.nextTriggerAt = obtenerProximaFecha(base, recordatorio.periodicidad || 'once', new Date()).getTime();
                }

                  // El render se hace en bloque al final para evitar duplicados en la vista.

                if ((recordatorio.deliveryMode || 'local') === 'local') {
                    programarRecordatorio(recordatorio);
                }
            });

            guardarRecordatorios(recordatorios);
              renderizarListaRecordatorios();
            revisarRecordatoriosVencidos();
        }

        function iniciarVigilanciaRecordatorios() {
            setInterval(revisarRecordatoriosVencidos, 30000);
            window.addEventListener('focus', () => {
                revisarRecordatoriosVencidos();
                actualizarEstadoPushUI();
            });
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) {
                    revisarRecordatoriosVencidos();
                    actualizarEstadoPushUI();
                }
            });
        }

        function revisarRecordatoriosVencidos() {
            const ahora = Date.now();
            const recordatorios = obtenerRecordatorios();

            recordatorios.forEach(recordatorio => {
                if ((recordatorio.deliveryMode || 'local') !== 'local') {
                    return;
                }

                if (recordatorio.nextTriggerAt <= ahora) {
                    dispararRecordatorio(recordatorio.id);
                }
            });
        }

        function programarRecordatorio(recordatorio) {
            limpiarTemporizador(recordatorio.id);
            const delay = recordatorio.nextTriggerAt - Date.now();
            programarConDelay(recordatorio.id, delay);
        }

        function programarConDelay(reminderId, delay) {
            if (delay <= 0) {
                dispararRecordatorio(reminderId);
                return;
            }

            if (delay > MAX_TIMEOUT) {
                const timerId = setTimeout(() => {
                    const recordatorio = obtenerRecordatorios().find(item => item.id === reminderId);
                    if (!recordatorio) {
                        return;
                    }
                    programarConDelay(reminderId, recordatorio.nextTriggerAt - Date.now());
                }, MAX_TIMEOUT);
                timers.set(reminderId, timerId);
                return;
            }

            const timerId = setTimeout(() => {
                dispararRecordatorio(reminderId);
            }, delay);

            timers.set(reminderId, timerId);
        }

        async function dispararRecordatorio(reminderId) {
            if (processingReminderIds.has(reminderId)) {
                return;
            }

            processingReminderIds.add(reminderId);
            limpiarTemporizador(reminderId);

            try {
                const recordatorios = obtenerRecordatorios();
                const indice = recordatorios.findIndex(item => item.id === reminderId);

                if (indice === -1) {
                    return;
                }

                const recordatorio = recordatorios[indice];
                await mostrarNotificacion(recordatorio);

                if (recordatorio.periodicidad === 'once') {
                    recordatorios.splice(indice, 1);
                } else {
                    const base = recordatorio.baseDateISO ? new Date(recordatorio.baseDateISO) : new Date();
                    const proxima = obtenerProximaFecha(base, recordatorio.periodicidad, new Date());
                    recordatorio.nextTriggerAt = proxima.getTime();
                    recordatorios[indice] = recordatorio;
                    programarRecordatorio(recordatorio);
                }

                guardarRecordatorios(recordatorios);
                  renderizarListaRecordatorios();
            } finally {
                processingReminderIds.delete(reminderId);
            }
        }

        async function mostrarNotificacion(recordatorio) {
            const permiso = await solicitarPermisoNotificaciones(false);
            const payloadCanal = construirPayloadCanal(recordatorio);

            if (permiso !== 'granted') {
                alert(`🔔 Recordatorio:\n${recordatorio.mensajeCompleto}`);
                return;
            }

            const opciones = {
                body: recordatorio.mensajeCompleto,
                icon: 'https://cdn-icons-png.flaticon.com/512/2921/2921222.png',
                badge: 'https://cdn-icons-png.flaticon.com/512/2921/2921222.png',
                tag: `miso-reminder-${recordatorio.id}`,
                renotify: true,
                data: payloadCanal,
                actions: construirAccionesNotificacion(recordatorio.medio)
            };

            if ('serviceWorker' in navigator) {
                try {
                    const registro = await navigator.serviceWorker.ready;
                    await registro.showNotification('Miso Reminder', opciones);
                    return;
                } catch {
                    // continúa al fallback local
                }
            }

            const notificacion = new Notification('Miso Reminder', { body: recordatorio.mensajeCompleto });
            if (payloadCanal.primaryUrl) {
                notificacion.onclick = () => {
                    window.open(payloadCanal.primaryUrl, '_blank');
                    window.focus();
                    notificacion.close();
                };
            }
        }

        function construirPayloadCanal(recordatorio) {
            const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(recordatorio.mensajeCompleto)}`;
            const emailUrl = `mailto:?subject=Recordatorio%20Miso%20Reminder&body=${encodeURIComponent(recordatorio.mensajeCompleto)}`;

            if (recordatorio.medio === 'whatsapp') {
                return {
                    mode: 'whatsapp',
                    primaryUrl: whatsappUrl,
                    whatsappUrl
                };
            }

            if (recordatorio.medio === 'email') {
                return {
                    mode: 'email',
                    primaryUrl: emailUrl,
                    emailUrl
                };
            }

            return { mode: 'self' };
        }

        function construirAccionesNotificacion(medio) {
            if (medio === 'whatsapp') {
                return [{ action: 'open-whatsapp', title: 'Abrir WhatsApp' }];
            }

            if (medio === 'email') {
                return [{ action: 'open-email', title: 'Abrir correo' }];
            }

            return [{ action: 'open-app', title: 'Abrir app' }];
        }

        function obtenerProximaFecha(fechaBase, periodicidad, ahora) {
            let proxima = new Date(fechaBase);

            if (Number.isNaN(proxima.getTime())) {
                proxima = new Date(ahora);
            }

            if (periodicidad === 'once') {
                return proxima <= ahora ? new Date(ahora.getTime() + 1000) : proxima;
            }

            while (proxima <= ahora) {
                if (periodicidad === 'daily') {
                    proxima.setDate(proxima.getDate() + 1);
                } else if (periodicidad === 'weekly') {
                    proxima.setDate(proxima.getDate() + 7);
                } else if (periodicidad === 'monthly') {
                    proxima.setMonth(proxima.getMonth() + 1);
                } else {
                    proxima = new Date(ahora.getTime() + 1000);
                    break;
                }
            }

            return proxima;
        }

        async function solicitarPermisoNotificaciones(interactivo) {
            if (!('Notification' in window)) {
                return 'denied';
            }

            if (Notification.permission === 'granted') {
                return 'granted';
            }

            if (Notification.permission === 'denied') {
                return 'denied';
            }

            if (!interactivo) {
                return 'default';
            }

            return Notification.requestPermission();
        }

        function obtenerRecordatorios() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                return data ? JSON.parse(data) : [];
            } catch {
                return [];
            }
        }

        function guardarRecordatorios(recordatorios) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(recordatorios));
        }

          async function cargarVersionApp() {
              try {
                  const respuesta = await fetch('./api/app-version');
                  if (!respuesta.ok) {
                      return;
                  }

                  const data = await respuesta.json();
                  if (data?.version) {
                      appVersion = String(data.version);
                  }
              } catch {
                  // mantiene fallback local
              }
          }

          function renderizarVersionApp() {
              if (!versionTextEl) {
                  return;
              }

              versionTextEl.textContent = `v${appVersion}`;
          }

        function limpiarTemporizador(reminderId) {
            const timerId = timers.get(reminderId);
            if (timerId) {
                clearTimeout(timerId);
                timers.delete(reminderId);
            }
        }

        function traducirPeriodicidad(valor) {
            if (valor === 'daily') return 'Diario';
            if (valor === 'weekly') return 'Semanal';
            if (valor === 'monthly') return 'Mensual';
            return 'Una sola vez';
        }

        function traducirMedio(valor) {
            if (valor === 'whatsapp') return 'WhatsApp';
            if (valor === 'email') return 'Correo';
            return 'Notificación';
        }

        function formatearFecha(timestamp) {
            return new Date(timestamp).toLocaleString('es-CO', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function generarId() {
            if (window.crypto && crypto.randomUUID) {
                return crypto.randomUUID();
            }

            return `miso-${Date.now()}-${Math.random().toString(16).slice(2)}`;
        }

        async function registrarServiceWorker() {
            if (!('serviceWorker' in navigator)) {
                return;
            }

            try {
                await navigator.serviceWorker.register('./sw.js');
            } catch (error) {
                console.log('Error al registrar SW', error);
            }
        }

        async function cargarClavePublicaBackend() {
            try {
                const respuesta = await fetch('./api/public-key');
                if (!respuesta.ok) {
                    backendPublicKey = null;
                    return;
                }

                const data = await respuesta.json();
                backendPublicKey = data.publicKey || null;
            } catch {
                backendPublicKey = null;
            }
        }

        function setPushStatus(texto, tipo) {
            if (!pushStatusEl) {
                return;
            }

            pushStatusEl.textContent = texto;
            pushStatusEl.classList.remove('ok', 'warn', 'off');
            pushStatusEl.classList.add(tipo);
        }

        async function actualizarEstadoPushUI() {
            if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
                setPushStatus('Push: No compatible', 'off');
                return;
            }

            if (Notification.permission === 'denied') {
                setPushStatus('Push: Bloqueado', 'off');
                return;
            }

            if (Notification.permission !== 'granted') {
                setPushStatus('Push: Permiso pendiente', 'warn');
                return;
            }

            if (!backendPublicKey) {
                setPushStatus('Push: Sin backend', 'warn');
                return;
            }

            try {
                const registro = await navigator.serviceWorker.ready;
                const suscripcion = await registro.pushManager.getSubscription();

                if (suscripcion) {
                    setPushStatus('Push: Activo', 'ok');
                } else {
                    setPushStatus('Push: Sin suscripcion', 'warn');
                }
            } catch {
                setPushStatus('Push: Error de estado', 'off');
            }
        }

        async function asegurarSuscripcionPush() {
            if (!backendPublicKey || !('serviceWorker' in navigator)) {
                return false;
            }

            if (Notification.permission !== 'granted') {
                return false;
            }

            try {
                const suscripcion = await obtenerOSuscribirPush();
                if (!suscripcion) {
                    return false;
                }

                const deviceId = obtenerDeviceId();
                const subResp = await fetch('./api/subscribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ deviceId, subscription: suscripcion })
                });

                await actualizarEstadoPushUI();
                return subResp.ok;
            } catch {
                await actualizarEstadoPushUI();
                return false;
            }
        }

        async function sincronizarRecordatoriosConServidor() {
            if (!backendPublicKey || !('serviceWorker' in navigator)) {
                return;
            }

            const permiso = await solicitarPermisoNotificaciones(false);
            if (permiso !== 'granted') {
                return;
            }

            const recordatorios = obtenerRecordatorios();
            const pendientesLocales = recordatorios.filter(item => (item.deliveryMode || 'local') === 'local');

            if (!pendientesLocales.length) {
                return;
            }

            try {
                const suscripcion = await obtenerOSuscribirPush();
                if (!suscripcion) {
                    return;
                }

                const deviceId = obtenerDeviceId();
                const subResp = await fetch('./api/subscribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ deviceId, subscription: suscripcion })
                });

                if (!subResp.ok) {
                    return;
                }

                let huboCambios = false;

                for (const recordatorio of pendientesLocales) {
                    const reminderResp = await fetch('./api/reminders', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ deviceId, reminder: recordatorio })
                    });

                    if (reminderResp.ok) {
                        recordatorio.deliveryMode = 'server';
                        limpiarTemporizador(recordatorio.id);
                        huboCambios = true;
                    }
                }

                if (huboCambios) {
                    guardarRecordatorios(recordatorios);
                }
            } catch {
                // Si falla la sincronización, los recordatorios siguen en modo local.
            }

            await actualizarEstadoPushUI();
        }

        async function intentarProgramarEnServidor(recordatorio, permiso) {
            if (permiso !== 'granted' || !backendPublicKey || !('serviceWorker' in navigator)) {
                await actualizarEstadoPushUI();
                return false;
            }

            try {
                const suscripcion = await obtenerOSuscribirPush();
                if (!suscripcion) {
                    return false;
                }

                const deviceId = obtenerDeviceId();

                const subResp = await fetch('./api/subscribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ deviceId, subscription: suscripcion })
                });

                if (!subResp.ok) {
                    return false;
                }

                const reminderResp = await fetch('./api/reminders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ deviceId, reminder: recordatorio })
                });

                await actualizarEstadoPushUI();
                return reminderResp.ok;
            } catch {
                await actualizarEstadoPushUI();
                return false;
            }
        }

        async function obtenerOSuscribirPush() {
            const registro = await navigator.serviceWorker.ready;
            let suscripcion = await registro.pushManager.getSubscription();

            if (suscripcion) {
                return suscripcion;
            }

            suscripcion = await registro.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: base64UrlToUint8Array(backendPublicKey)
            });

            return suscripcion;
        }

        function obtenerDeviceId() {
            let deviceId = localStorage.getItem(DEVICE_KEY);
            if (deviceId) {
                return deviceId;
            }

            deviceId = generarId();
            localStorage.setItem(DEVICE_KEY, deviceId);
            return deviceId;
        }

        function base64UrlToUint8Array(base64String) {
            const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
            const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
            const rawData = atob(base64);
            const outputArray = new Uint8Array(rawData.length);

            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }

            return outputArray;
        }
